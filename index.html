<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 拉霸機遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🎰 拉霸機遊戲</h1>
            <div class="balance-display">
                💰 餘額: <span id="balance">1000</span> 點
            </div>
        </header>

        <main class="game-main">
            <!-- 拉霸機主體 -->
            <div class="slot-machine">
                <div class="machine-frame">
                    <!-- 中獎線 -->
                    <div class="paylines">
                        <div class="win-line line-1"></div>
                        <div class="win-line line-2"></div>
                        <div class="win-line line-3"></div>
                        <div class="win-line line-4"></div>
                        <div class="win-line line-5"></div>
                    </div>
                    
                    <!-- 轉輪區域 -->
                    <div class="reels-container">
                        <div class="reel" id="reel1">
                            <div class="reel-inner"></div>
                        </div>
                        <div class="reel" id="reel2">
                            <div class="reel-inner"></div>
                        </div>
                        <div class="reel" id="reel3">
                            <div class="reel-inner"></div>
                        </div>
                        <div class="reel" id="reel4">
                            <div class="reel-inner"></div>
                        </div>
                        <div class="reel" id="reel5">
                            <div class="reel-inner"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 拉桿 -->
                <div class="lever-container">
                    <div class="lever" id="lever">
                        <div class="lever-handle"></div>
                    </div>
                </div>
            </div>

            <!-- 控制面板 -->
            <div class="control-panel">
                <!-- 下注控制 -->
                <div class="bet-section">
                    <label for="bet">下注金額:</label>
                    <div class="bet-controls">
                        <button id="bet-minus" class="bet-btn">-</button>
                        <input type="number" id="bet" min="10" max="100" step="10" value="10">
                        <button id="bet-plus" class="bet-btn">+</button>
                    </div>
                    <div class="preset-bets">
                        <button class="preset-btn active" data-bet="10">10</button>
                        <button class="preset-btn" data-bet="20">20</button>
                        <button class="preset-btn" data-bet="50">50</button>
                        <button class="preset-btn" data-bet="100">100</button>
                    </div>
                </div>

                <!-- 遊戲按鈕 -->
                <div class="game-buttons">
                    <button id="spin-button" class="main-button spin-btn">
                        🎰 轉動
                    </button>
                    <button id="auto-button" class="main-button auto-btn">
                        🔄 自動
                    </button>
                    <button id="stop-auto" class="main-button stop-btn" style="display: none;">
                        ⏹️ 停止
                    </button>
                </div>
            </div>

            <!-- 訊息顯示 -->
            <div id="message" class="message-display"></div>
        </main>

        <!-- 獎金表 -->
        <aside class="paytable">
            <h3>🏆 獎金表</h3>
            <div class="paytable-content">
                <div class="payout-row">
                    <span class="symbol">💎 鑽石</span>
                    <span class="payout">3個: ×20 | 4個: ×100 | 5個: ×1000</span>
                </div>
                <div class="payout-row">
                    <span class="symbol">其他符號</span>
                    <span class="payout">3個: ×5 | 4個: ×50 | 5個: ×500</span>
                </div>
                <div class="special-row">
                    <span class="symbol">🔔 3個鈴鐺</span>
                    <span class="feature">免費轉盤</span>
                </div>
            </div>
        </aside>
    </div>

    <!-- 特效容器 -->
    <div id="win-effects" class="win-effects"></div>

    <!-- Debug 面板 -->
    <div id="debug-panel" class="debug-panel" style="display: none;">
        <h4>Debug 資訊</h4>
        <div id="debug-content"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
